<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} — AI Engineer</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{NAME}} — AI Engineer">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="{{UP}}avatar.png">
<link rel="icon" href="{{UP}}avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{UP}}style.css">
</head>
<body>
<div class="layout">
  <aside class="side">
    <img class="avatar" src="{{UP}}avatar.png" alt="{{NAME}}" width="160" height="160">
    <h1>{{NAME}}</h1>
    <p class="role">AI Engineer · Researcher</p>
    <nav class="contact">{{CONTACT}}</nav>
    <div class="actions">
      {{PDF_BUTTON}}
      <a class="btn ghost" href="{{SWITCH_HREF}}">{{SWITCH_LABEL}}</a>
    </div>
    <nav class="toc" aria-label="{{CONTENTS}}">{{NAV}}</nav>
  </aside>
  <main>
{{BODY}}
    <footer>
      <p>{{UPDATED}}</p>
      <a href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">{{TOP}} ↑</a>
    </footer>
  </main>
</div>
</body>
</html>
