<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} — {{ROLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{NAME}} — {{ROLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="{{UP}}avatar.png">
<link rel="icon" href="{{UP}}avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{UP}}style.css">
</head>
<body id="top">
<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="{{HOME}}">{{NAME}}</a>
    <div class="bar-actions">
      <a class="lang" href="{{SWITCH_HREF}}">{{SWITCH_LABEL}}</a>
      {{PDF_BUTTON}}
    </div>
  </div>
</header>

<div class="hero">
  <div class="wrap hero-inner">
    <img class="avatar" src="{{UP}}avatar.png" alt="{{NAME}}" width="132" height="132">
    <div class="hero-text">
      <h1>{{NAME}}</h1>
      <p class="role">{{ROLE}}</p>
      <p class="summary">{{SUMMARY}}</p>
      <nav class="contact">{{CONTACT}}</nav>
    </div>
  </div>
</div>

<main class="wrap">
{{BODY}}
</main>

</body>
</html>
