# Rebuilds the PDFs and the website whenever the CV changes, then deploys to GitHub Pages.
name: Build CV & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile PDFs (xelatex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            resume.tex
            resume_vi.tex
            resume_academic.tex
            resume_industry.tex
          latexmk_use_xelatex: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site from the .tex sources
        run: python3 site/build.py --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
